[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-agentreader"
version = "0.1.0"
description = "LangChain document loader for AgentReader: web pages, JS-rendered pages and PDF URLs to clean Markdown for LLMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "AgentReader", email = "contact@agentreader.xyz" }]
keywords = ["langchain", "document-loader", "markdown", "web-scraping", "pdf", "llm", "rag", "agentreader"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["langchain-core>=0.3,<2", "requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://agentreader.xyz"
Documentation = "https://agentreader.xyz/llms.txt"
Source = "https://github.com/agentreader-xyz/agentreader-python"

[tool.hatch.build.targets.wheel]
packages = ["langchain_agentreader"]
