[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-readers-agentreader"
version = "0.1.0"
description = "LlamaIndex reader for AgentReader: web pages, JS-rendered pages and PDF URLs to clean Markdown for LLMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "AgentReader", email = "contact@agentreader.xyz" }]
keywords = ["llama-index", "llamaindex", "reader", "markdown", "web", "pdf", "llm", "rag", "agentreader"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = ["llama-index-core>=0.12,<0.16", "requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://agentreader.xyz"
Documentation = "https://agentreader.xyz/llms.txt"
Source = "https://github.com/agentreader-xyz/agentreader-python"

[tool.hatch.build.targets.wheel]
packages = ["llama_index"]

[tool.llamahub]
contains_example = false
import_path = "llama_index.readers.agentreader"

[tool.llamahub.class_authors]
AgentReaderWebReader = "agentreader-xyz"
